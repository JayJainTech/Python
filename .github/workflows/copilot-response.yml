name: Copilot Auto-Response

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      pull-requests: write
      contents: read
      
    steps:
      - name: Check if comment mentions Copilot
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body;
            const hasCopilot = /\b(copilot|@github-copilot)\b/i.test(comment);
            core.setOutput('should_respond', hasCopilot);
            
            // Extract the actual question (remove @copilot mention)
            const question = comment.replace(/\b@?github-copilot\b/i, '').replace(/\bcopilot\b/i, '').trim();
            core.setOutput('question', question);
      
      - name: Get AI Response
        if: steps.check.outputs.should_respond == 'true'
        id: ai
        uses: actions/github-script@v7
        env:
          QUESTION: ${{ steps.check.outputs.question }}
        with:
          script: |
            const question = process.env.QUESTION || "What can I help you with?";
            
            // Generate a simple response based on keywords
            let response = "I'm a simple bot. Please ask a clearer question.";
            
            const q = question.toLowerCase();
            if (q.includes('help') || q.includes('how')) {
              response = "I can help with code reviews, questions, and suggestions. Ask me anything about your PR!";
            } else if (q.includes('review') || q.includes('problem') || q.includes('issue')) {
              response = "Good question! I'd recommend reviewing the code for edge cases, error handling, and test coverage.";
            } else if (q.includes('python') || q.includes('code')) {
              response = "Code review tip: Always add comments for complex logic, include tests, and follow PEP 8 standards.";
            } else if (question.length > 5) {
              response = `Thanks for asking: "${question.substring(0, 50)}${question.length > 50 ? '...' : ''}". I'm still learning! 🚀`;
            }
            
            core.setOutput('response', response);
      
      - name: Post Response Comment
        if: steps.check.outputs.should_respond == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const response = `${{ steps.ai.outputs.response }}`;
            const questionText = `${{ steps.check.outputs.question }}`;
            
            const comment = `**Copilot Response:**\n\n> **Q:** ${questionText || '(no question provided)'}\n\n**A:** ${response}\n\n---\n*This is an automated response from GitHub Actions.*`;
            
            if (context.issue.pull_request) {
              github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                body: comment,
                event: 'COMMENT'
              });
            } else {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
