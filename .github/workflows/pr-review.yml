name: Automated PR Code Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review (leave empty for current PR)'
        required: false
        type: string

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install linting tools
        run: |
          pip install pylint flake8 black

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40
        with:
          files: |
            **.py

      - name: Run pylint on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        id: pylint
        continue-on-error: true
        run: |
          pylint ${{ steps.changed-files.outputs.all_changed_files }} --exit-zero --output-format=json > pylint-report.json || true
          cat pylint-report.json

      - name: Check code style with flake8
        if: steps.changed-files.outputs.any_changed == 'true'
        id: flake8
        continue-on-error: true
        run: |
          flake8 ${{ steps.changed-files.outputs.all_changed_files }} --format=json > flake8-report.json || true
          cat flake8-report.json

      - name: Check formatting with black
        if: steps.changed-files.outputs.any_changed == 'true'
        id: black
        continue-on-error: true
        run: |
          black --check --diff ${{ steps.changed-files.outputs.all_changed_files }} > black-diff.txt 2>&1 || true

      - name: Comment on PR with review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let comment = '## 🔍 Automated Code Review\n\n';
            let hasIssues = false;
            
            // Suggestion mapping for common issues
            const suggestions = {
              'line-too-long': '→ **Suggestion:** Break long lines into multiple lines (max 79-88 chars)',
              'missing-docstring': '→ **Suggestion:** Add a docstring explaining what this function/class does',
              'invalid-name': '→ **Suggestion:** Use snake_case for variables/functions (e.g., `my_variable` not `myVariable`)',
              'broad-except': '→ **Suggestion:** Catch specific exceptions instead of bare `except:`',
              'unused-argument': '→ **Suggestion:** Remove unused parameter or prefix with `_` if intentional',
              'too-many-arguments': '→ **Suggestion:** Consider grouping related arguments into a class or dict',
              'E501': '→ **Suggestion:** Line too long - break into multiple lines',
              'E302': '→ **Suggestion:** Add 2 blank lines before function/class definition',
              'E303': '→ **Suggestion:** Remove extra blank lines',
              'E501': '→ **Suggestion:** Line too long (>79 chars) - use line continuation',
              'W503': '→ **Suggestion:** Break before binary operator for readability'
            };
            
            try {
              const pylintReport = JSON.parse(fs.readFileSync('pylint-report.json', 'utf8'));
              if (pylintReport.length > 0) {
                hasIssues = true;
                comment += '### 🚨 Pylint Issues\n';
                pylintReport.forEach(issue => {
                  comment += `- **${issue.message}** (\`${issue.symbol}\`) in \`${issue.path}:${issue.line}\`\n`;
                  const key = issue.symbol;
                  if (suggestions[key]) {
                    comment += `  ${suggestions[key]}\n`;
                  }
                });
                comment += '\n';
              }
            } catch (e) {
              // No pylint issues
            }
            
            try {
              const flake8Report = JSON.parse(fs.readFileSync('flake8-report.json', 'utf8'));
              if (flake8Report.length > 0) {
                hasIssues = true;
                comment += '### ⚠️ Flake8 Style Issues\n';
                flake8Report.forEach(issue => {
                  comment += `- **${issue.code}** in \`${issue.filename}:${issue.line_number}\`: ${issue.text}\n`;
                  const key = issue.code;
                  if (suggestions[key]) {
                    comment += `  ${suggestions[key]}\n`;
                  }
                });
                comment += '\n';
              }
            } catch (e) {
              // No flake8 issues
            }
            
            try {
              const blackDiff = fs.readFileSync('black-diff.txt', 'utf8');
              if (blackDiff.trim()) {
                hasIssues = true;
                comment += '### 🎨 Formatting Issues (Black)\n';
                comment += '→ **Suggestion:** Run `black .` locally to auto-format your code\n\n';
                comment += '```diff\n' + blackDiff.substring(0, 1000) + '\n```\n\n';
              }
            } catch (e) {
              // No formatting issues
            }
            
            if (!hasIssues) {
              comment += '✅ **All checks passed!** Your code looks great!\n\n';
              comment += '**Tips for maintaining code quality:**\n';
              comment += '- Run `black .` before committing\n';
              comment += '- Run `pylint **/*.py` to catch issues early\n';
              comment += '- Run `flake8 .` for style compliance\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
